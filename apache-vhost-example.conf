# Example Apache VirtualHost for School ERP.
# Copy the relevant block into your Apache config (e.g. XAMPP's
# xampp/apache/conf/extra/httpd-vhosts.conf) and restart Apache.

# ---------------------------------------------------------------
# OPTION A (recommended): dedicated vhost, DocumentRoot -> public/
# ---------------------------------------------------------------
<VirtualHost *:80>
    ServerName school-erp.local
    DocumentRoot "C:/xampp/htdocs/school-erp/public"

    <Directory "C:/xampp/htdocs/school-erp/public">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "logs/school-erp-error.log"
    CustomLog "logs/school-erp-access.log" common
</VirtualHost>

# Then add to your hosts file (C:\Windows\System32\drivers\etc\hosts):
#   127.0.0.1   school-erp.local
# and set APP_URL=http://school-erp.local in .env

# ---------------------------------------------------------------
# OPTION B (quick local testing, no vhost needed):
# Drop the project folder straight into htdocs/ as "school-erp" and
# rely on the root .htaccess to route into public/. Then visit:
#   http://localhost/school-erp/
# and set APP_URL=http://localhost/school-erp/public in .env
# ---------------------------------------------------------------
